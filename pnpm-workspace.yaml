packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

# @tiptap/react pulls these in with a caret range; keep every @tiptap package on one version.
overrides:
  '@tiptap/extension-bubble-menu': 3.31.3
  '@tiptap/extension-floating-menu': 3.31.3
  # Build and migration tools only; older esbuild copies have dev-server advisories.
  esbuild: 0.28.2
