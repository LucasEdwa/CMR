# Optional: Postgres 17 in Docker (matches Neon). Stop any local Postgres on 5432 first,
# then: docker compose up -d && pnpm db:setup && pnpm db:migrate && pnpm seed
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 20
volumes:
  pgdata:
