name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  # Dependencies with known high/critical advisories, secrets in the history, and risky code patterns.
  # Scanners run from images pinned by digest, so a changed tag cannot change what runs here.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Secret scan (gitleaks v8.30.1)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - name: Code scan (Semgrep 1.178.0)
        run: >-
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --error --metrics=off
          --config p/owasp-top-ten --config p/typescript --config p/nodejs --config p/react
          --exclude node_modules --exclude dist --exclude '*.test.ts' --exclude e2e --exclude 'drizzle/meta'
          apps packages

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/crm
      DATABASE_OWNER_URL: postgres://crm_owner:crm_owner@localhost:5432/crm
      RUN_WORKER: 'true'
      SMTP_URL: smtp://localhost:1025
      EMAIL_DELIVERY: queue
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:setup
      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm test
      - run: pnpm --filter @crm/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - run: pnpm build
