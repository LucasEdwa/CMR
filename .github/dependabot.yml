# Weekly update PRs for npm packages and GitHub Actions (pinned SHAs are updated too).
# New versions wait 14 days before Dependabot proposes them, to stay clear of fresh compromises.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
